<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-white flex justify-center items-center max-w-sm mx-auto min-h-screen relative">

    <!-- แก้ไขโหลดิ้งเป็นแบบใหม่ -->
    <div id="loading-overlay" class="fixed inset-0 bg-gray-200 bg-opacity-80 flex items-center justify-center z-50 hidden">
        <div class="flex flex-col items-center">
            <svg class="animate-spin h-12 w-12 text-teal-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span class="text-teal-500 text-lg">กำลังโหลด...</span>
        </div>
    </div>

    <!-- เนื้อหาหลักของหน้าเว็บ -->
    <div class="max-w-sm w-full p-6 rounded-xl bg-gray-100 shadow-lg text-gray-800">
        <div class="flex justify-between items-center mb-4">
            <div>
                <p class="text-gray-600 text-xs">Welcome back</p>
                <input type="text" class="input-field bg-white text-gray-800 text-xl font-bold border border-gray-300 rounded-md p-2"
                    id="displayName" name="displayName" readonly>
            </div>
            <div class="w-12 h-12 rounded-lg flex justify-center items-center shadow-inner">
                <img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png"
                    alt="Profile Image" id="profileImage" class="w-10 h-10 bg-white rounded-lg shadow-lg">
            </div>
        </div>
        <div class="flex items-center border border-teal-400 p-1 space-x-2 rounded-md mb-4">
            <input type="text"
                class="input-field bg-white w-full text-center text-teal-400 text-xs font-bold border border-teal-300 rounded-md p-2"
                id="userId" placeholder="Line ID" name="userId" readonly>
        </div>

        <form id="edit-form">

            <input type="hidden" id="edit-id">

            <div class="mb-4 hidden">
                <label for="edit-userID" class="block text-sm">UserID</label>
                <input type="text" id="edit-userID" class="w-full border px-2 py-1 rounded" disabled>
            </div>
            <div class="flex my-8">
                <div class="w-48">
                    <label for="edit-imageUrl" class="block hidden text-sm">URL รูปภาพ</label>
                    <input type="hidden" id="edit-imageUrl" class="w-full border px-2 py-1 rounded"
                        oninput="updateImagePreview()" disabled>
                    <img id="image-preview"
                        src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png"
                        alt="Image Preview" class="w-20 h-20 rounded">
                </div>
            </div>
            <div class="mb-4 hidden" id="image-upload-section">
                <label for="edit-image" class="block text-sm">อัปโหลดรูปภาพ</label>
                <input type="file" id="edit-image" class="w-full border px-2 py-1 rounded" disabled>
            </div>
            <div class="mb-4">
                <label for="edit-name" class="block text-xs text-teal-500">ชื่อ สกุล</label>
                <input type="text" id="edit-name" class="input-field bg-white text-gray-800 text-md font-bold border border-gray-300 rounded-md p-2" disabled>
            </div>
            <div class="mb-4">
                <label for="edit-employeeID" class="block text-xs text-teal-500">เบอร์ติดต่อ</label>
                <input type="text" id="edit-employeeID" class="input-field bg-white text-gray-800 text-md font-bold border border-gray-300 rounded-md p-2" disabled>
            </div>
            <div class="mb-4">
                <label for="edit-department" class="block text-xs text-teal-500">เพิ่มเติม..</label>
                <input type="text" id="edit-department" class="input-field bg-white text-gray-800 text-md font-bold border border-gray-300 rounded-md p-2" disabled>
            </div>
            <div class="flex justify-start">
                <button type="button" id="edit-button"
                    class="bg-teal-500 text-white py-1 px-3 rounded hover:bg-teal-700">แก้ไข</button>
                <button type="button" class="bg-gray-500 text-white py-1 px-3 rounded hover:bg-gray-700 mr-2 hidden"
                    onclick="cancelEdit()">ยกเลิก</button>
                <button type="submit"
                    class="bg-green-500 text-white py-1 px-3 rounded hover:bg-green-700 hidden">บันทึก</button>
            </div>
        </form>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxh6MnlWyyyk_zlppsPv8acuyckmCppUaFHuSbEGV2uCU3pHW-dYIpvWVAn12QuyHEW/exec';
        const LIFF_ID = '2006806033-LlJE1nO7'; // ใส่ LIFF ID ของคุณที่นี่

        let latestData = {};

        // ฟังก์ชันสำหรับล็อกหรือปลดล็อกฟอร์มและจัดการการแสดงผลปุ่ม
        function toggleFormEditing(enable) {
            const inputs = document.querySelectorAll('#edit-form input');
            const saveButton = document.querySelector('#edit-form button[type="submit"]');
            const cancelButton = document.querySelector('#edit-form button[type="button"]:not(#edit-button)');
            const imageUploadSection = document.getElementById('image-upload-section');

            inputs.forEach(input => {
                input.disabled = !enable; // ปลดล็อก input
            });

            if (enable) {
                saveButton.classList.remove('hidden');
                cancelButton.classList.remove('hidden');
                imageUploadSection.classList.remove('hidden'); // แสดงส่วนอัปโหลดรูปภาพ
                document.getElementById('edit-button').classList.add('hidden'); // ซ่อนปุ่ม Edit เมื่อทำการแก้ไข
            } else {
                saveButton.classList.add('hidden');
                cancelButton.classList.add('hidden');
                imageUploadSection.classList.add('hidden'); // ซ่อนส่วนอัปโหลดรูปภาพ
                document.getElementById('edit-button').classList.remove('hidden'); // แสดงปุ่ม Edit
            }
        }

        // ฟังก์ชันสำหรับอัปเดตการแสดงผลของรูปภาพตาม URL ที่ป้อน
        function updateImagePreview() {
            const imageUrl = document.getElementById('edit-imageUrl').value;
            const imagePreview = document.getElementById('image-preview');
            imagePreview.src = imageUrl ? imageUrl : 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png'; // อัปเดต src ของรูปภาพ
        }

        // ฟังก์ชันเพื่อแสดงแอนิเมชันโหลด
        function showLoading() {
            document.getElementById('loading-overlay').classList.remove('hidden');
        }

        // ฟังก์ชันเพื่อซ่อนแอนิเมชันโหลด
        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        async function searchDataByUserlineId(userlineId) {
            showLoading(); // แสดงแอนิเมชันโหลดเฉพาะในฟังก์ชันนี้
            try {
                // ส่ง userlineId เป็นพารามิเตอร์ในการค้นหา
                const response = await fetch(`${WEB_APP_URL}?method=getUserData&userlineId=${encodeURIComponent(userlineId)}`);
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    // ใช้ข้อมูลจากแถวสุดท้ายที่พบ
                    latestData = data[data.length - 1];

                    // กรอกข้อมูลลงในฟอร์ม
                    document.getElementById('edit-id').value = latestData.keyid;
                    document.getElementById('edit-userID').value = latestData.userlineId;
                    document.getElementById('edit-name').value = latestData.nameId;
                    document.getElementById('edit-employeeID').value = latestData.keynumberId;
                    document.getElementById('edit-department').value = latestData.keynumber2Id;
                    document.getElementById('edit-imageUrl').value = latestData.fileLink;

                    updateImagePreview(); // อัปเดตการแสดงผลของรูปภาพ
                } else {
                    Swal.fire({
                        title: 'คุณยังไม่ได้ลงทะเบียน',
                        text: 'กรุณาลงทะเบียนก่อนใช้งาน',
                        icon: 'warning',
                        confirmButtonText: 'ตกลง'
                    });
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                Swal.fire({
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถดึงข้อมูลได้ กรุณาลองใหม่อีกครั้ง',
                    icon: 'error',
                    confirmButtonText: 'ตกลง'
                });
            } finally {
                hideLoading(); // ซ่อนแอนิเมชันโหลด
            }
        }

        // เริ่มต้นด้วยการล็อกฟอร์มและซ่อนปุ่ม
        window.onload = async () => {
            try {
                await initializeLiff();
                await getUserProfile(); // เริ่มต้น LIFF และค้นหาข้อมูลทันทีที่ได้ userId
            } catch (error) {
                console.error('Initialization error:', error);
            } finally {
                toggleFormEditing(false); // ล็อกฟอร์มในตอนเริ่มต้นและซ่อนปุ่ม
            }
        };

        async function initializeLiff() {
            try {
                await liff.init({ liffId: `${LIFF_ID}` }); // ใส่ LIFF ID ของคุณที่นี่
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    const userlineId = profile.userId; // ดึง userId จากโปรไฟล์
                    searchDataByUserlineId(userlineId); // ค้นหาข้อมูลตาม userId
                } else {
                    liff.login();
                }
            } catch (error) {
                console.error('LIFF Initialization failed', error);
            }
        }

        // ฟังก์ชันนี้ดึงข้อมูลโปรไฟล์ของผู้ใช้จาก LIFF
        async function getUserProfile() {
            try {
                // รับข้อมูลโปรไฟล์ของผู้ใช้
                const profile = await liff.getProfile();
                const userId = profile.userId;
                // กำหนดค่า userId และ displayName ในฟอร์ม
                document.getElementById('userId').value = userId;
                document.getElementById('displayName').value = profile.displayName;
                document.getElementById('profileImage').src = profile.pictureUrl || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';

            } catch (error) {
                // ถ้ามีข้อผิดพลาดในการดึงข้อมูลโปรไฟล์ จะทำการล็อกข้อผิดพลาดในคอนโซล
                console.error('Error getting profile data:', error);
            }
        }

        document.getElementById('edit-button').addEventListener('click', function () {
            toggleFormEditing(true); // ปลดล็อกฟอร์มเมื่อกดปุ่มแก้ไข
        });

        document.getElementById('edit-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            // ไม่แสดงแอนิเมชันโหลดในฟังก์ชันนี้
            // แต่ยังคงใช้ SweetAlert2 เพื่อแสดงการบันทึกข้อมูล

            const id = document.getElementById('edit-id').value;
            const userID = document.getElementById('edit-userID').value;
            const name = document.getElementById('edit-name').value;
            const employeeID = document.getElementById('edit-employeeID').value;
            const department = document.getElementById('edit-department').value;
            const imageFile = document.getElementById('edit-image').files[0];

            let imageUrl = document.getElementById('edit-imageUrl').value;

            // แสดงผลการโหลดด้วย SweetAlert2
            Swal.fire({
                title: 'กำลังบันทึกข้อมูล...',
                text: 'กรุณารอขณะบันทึกข้อมูลของคุณ',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading(); // แสดง spinner
                }
            });

            try {
                let result;
                if (imageFile) {
                    const base64Image = await getBase64(imageFile); // แปลงไฟล์เป็น Base64
                    result = await updateData(id, userID, name, employeeID, department, base64Image);
                } else {
                    result = await updateData(id, userID, name, employeeID, department, imageUrl);
                }

                // ตรวจสอบผลลัพธ์ที่ได้รับ
                if (result && result.includes('Data updated')) {
                    Swal.fire({
                        title: 'สำเร็จ',
                        text: 'บันทึกข้อมูลเรียบร้อยแล้ว!',
                        icon: 'success',
                        confirmButtonText: 'ตกลง'
                    });
                    await initializeLiff(); // อัปเดตข้อมูลในฟอร์มหลังจากบันทึกข้อมูลสำเร็จ
                } else {
                    throw new Error(result || 'ไม่สามารถบันทึกข้อมูลได้');
                }

            } catch (error) {
                console.error('Error saving data:', error);
                Swal.fire({
                    title: 'เกิดข้อผิดพลาด',
                    text: error.message || 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง',
                    icon: 'error',
                    confirmButtonText: 'ตกลง'
                });
            } finally {
                // ซ่อนแอนิเมชันโหลดไม่ได้ เนื่องจากไม่ได้แสดงตอนบันทึก
                cancelEdit();
            }
        });

        // ฟังก์ชันยกเลิกการแก้ไขและรีเซ็ตฟอร์ม
        function cancelEdit() {
            document.getElementById('edit-form').reset();
            document.getElementById('edit-id').value = latestData.keyid || '';
            document.getElementById('edit-userID').value = latestData.userlineId || '';
            document.getElementById('edit-name').value = latestData.nameId || '';
            document.getElementById('edit-employeeID').value = latestData.keynumberId || '';
            document.getElementById('edit-department').value = latestData.keynumber2Id || '';
            document.getElementById('edit-imageUrl').value = latestData.fileLink || '';

            updateImagePreview(); // อัปเดตการแสดงผลของรูปภาพ
            toggleFormEditing(false); // ล็อกฟอร์มอีกครั้งหลังจากรีเซ็ต
        }

        async function updateData(id, userID, name, employeeID, department, base64Image) {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `method=updateData&id=${encodeURIComponent(id)}&userID=${encodeURIComponent(userID)}&name=${encodeURIComponent(name)}&employeeID=${encodeURIComponent(employeeID)}&department=${encodeURIComponent(department)}&imageUrl=${encodeURIComponent(base64Image)}`
            });
            const result = await response.text();

            // ตรวจสอบว่าผลลัพธ์ที่ได้มีเนื้อหาหรือไม่
            if (!result || result.trim() === '') {
                throw new Error('Empty response from server');
            }

            return result;
        }

        // ฟังก์ชันสำหรับแปลงไฟล์เป็น Base64
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                let reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

    </script>
</body>

</html>
