<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลผู้ใช้งาน | Modern White Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .input-field-view {
            background-color: #f3f4f6; /* bg-gray-100 */
            color: #374151; /* text-gray-700 */
            border: 1px solid #e5e7eb; /* border-gray-300 */
            cursor: default;
        }
        .input-field-edit:focus {
            outline: none;
            border-color: #000000; /* Black border on focus */
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.2);
        }
        .input-field-edit {
            background-color: #ffffff;
            border: 1px solid #d1d5db; /* border-gray-300 */
        }
        /* Custom file input button */
        .file-input-label {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.25rem; /* py-3 px-5 */
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); /* shadow-sm */
            font-size: 0.875rem; /* text-sm */
            font-weight: 500; /* font-medium */
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-duration: 150ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body class="bg-white flex justify-center items-start min-h-screen py-8">

    <div id="loading-overlay" class="fixed inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50 hidden">
        <div class="flex flex-col items-center">
            <svg class="animate-spin h-12 w-12 text-black mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-gray-700 text-lg">กำลังโหลดข้อมูล...</span>
        </div>
    </div>

    <div class="w-full max-w-md p-8 space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-gray-600 text-sm">Welcome back,</p>
                <input type="text" class="bg-transparent text-gray-900 text-2xl font-bold w-full p-0 border-0 focus:ring-0"
                    id="displayName" name="displayName" readonly value="Display Name">
            </div>
            <div class="flex-shrink-0">
                <img src="https://placehold.co/100x100/E2E8F0/AAAAAA?text=P" alt="Profile Image" id="profileImage"
                    class="w-12 h-12 rounded-full shadow-lg object-cover">
            </div>
        </div>

        <!-- User Line ID (Readonly) -->
        <div>
            <label for="userId" class="block mb-1 text-xs font-medium text-gray-500">LINE User ID</label>
            <input type="text" class="input-field-view w-full p-3 text-sm text-gray-700 rounded-lg"
                id="userId" placeholder="Line ID (auto-filled)" name="userId" readonly>
        </div>

        <form id="edit-form" class="space-y-6">
            <input type="hidden" id="edit-id">
            <input type="hidden" id="edit-userID"> <!-- This will be populated from LIFF/searchData -->
            <input type="hidden" id="edit-imageUrl-current"> <!-- To store current image URL from server -->

            <!-- Image Section -->
            <div class="space-y-3">
                <label class="block text-sm font-medium text-gray-700">รูปโปรไฟล์</label>
                <div class="flex items-center space-x-4">
                    <div class="flex-shrink-0">
                        <img id="image-preview" src="https://placehold.co/400x400/E2E8F0/AAAAAA?text=รูป" alt="Image Preview"
                             class="h-24 w-24 object-cover rounded-lg bg-gray-100 border border-gray-300">
                    </div>
                    <div id="image-upload-section" class="flex-grow hidden">
                         <label for="edit-image"
                               class="file-input-label text-white bg-black hover:bg-gray-800 w-full sm:w-auto">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" class="mr-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            เปลี่ยนรูป
                        </label>
                        <input type="file" id="edit-image" accept="image/*" class="hidden">
                        <p class="text-gray-500 text-xs mt-1">เลือกไฟล์ใหม่เพื่อเปลี่ยน</p>
                    </div>
                </div>
            </div>

            <!-- Form Fields -->
            <div>
                <label for="edit-name" class="block mb-1 text-sm font-medium text-gray-700">ชื่อ-สกุล</label>
                <input type="text" id="edit-name" class="input-field-view w-full p-3 text-sm rounded-lg" disabled>
            </div>
            <div>
                <label for="edit-employeeID" class="block mb-1 text-sm font-medium text-gray-700">เบอร์ติดต่อ</label>
                <input type="text" id="edit-employeeID" class="input-field-view w-full p-3 text-sm rounded-lg" disabled>
            </div>
            <div>
                <label for="edit-department" class="block mb-1 text-sm font-medium text-gray-700">ข้อมูลเพิ่มเติม</label>
                <input type="text" id="edit-department" class="input-field-view w-full p-3 text-sm rounded-lg" disabled>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row sm:space-x-3 space-y-3 sm:space-y-0 pt-4">
                <button type="button" id="edit-button"
                    class="w-full bg-black text-white p-3 rounded-lg shadow-md hover:bg-gray-800 font-semibold transition-colors">
                    แก้ไขข้อมูล
                </button>
                <button type="submit" id="save-button"
                    class="w-full bg-black text-white p-3 rounded-lg shadow-md hover:bg-gray-800 font-semibold transition-colors hidden">
                    บันทึกการเปลี่ยนแปลง
                </button>
                <button type="button" id="cancel-button"
                    class="w-full bg-gray-600 text-white p-3 rounded-lg shadow-md hover:bg-gray-700 font-semibold transition-colors hidden"
                    onclick="cancelEdit()">
                    ยกเลิก
                </button>
            </div>
        </form>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxh6MnlWyyyk_zlppsPv8acuyckmCppUaFHuSbEGV2uCU3pHW-dYIpvWVAn12QuyHEW/exec';
        const LIFF_ID = '2006806033-LlJE1nO7'; // YOUR LIFF ID

        let latestData = {}; // To store the fetched data for reset purposes

        const form = document.getElementById('edit-form');
        const inputs = [
            document.getElementById('edit-name'),
            document.getElementById('edit-employeeID'),
            document.getElementById('edit-department')
        ];
        const editButton = document.getElementById('edit-button');
        const saveButton = document.getElementById('save-button');
        const cancelButton = document.getElementById('cancel-button');
        const imageUploadSection = document.getElementById('image-upload-section');
        const imagePreview = document.getElementById('image-preview');
        const imageFileInput = document.getElementById('edit-image');
        const currentImageUrlHiddenInput = document.getElementById('edit-imageUrl-current');


        function setFormInputs(data) {
            document.getElementById('edit-id').value = data.keyid || '';
            document.getElementById('edit-userID').value = data.userlineId || ''; // Ensure this is correctly populated
            document.getElementById('edit-name').value = data.nameId || '';
            document.getElementById('edit-employeeID').value = data.keynumberId || '';
            document.getElementById('edit-department').value = data.keynumber2Id || '';
            currentImageUrlHiddenInput.value = data.fileLink || '';
            imagePreview.src = data.fileLink || 'https://placehold.co/400x400/E2E8F0/AAAAAA?text=รูป';
        }

        function toggleFormEditing(enable) {
            inputs.forEach(input => {
                input.disabled = !enable;
                if (enable) {
                    input.classList.remove('input-field-view');
                    input.classList.add('input-field-edit');
                } else {
                    input.classList.remove('input-field-edit');
                    input.classList.add('input-field-view');
                }
            });

            imageFileInput.disabled = !enable; // Enable/disable file input
            imageFileInput.value = ''; // Clear file input on toggle

            if (enable) {
                editButton.classList.add('hidden');
                saveButton.classList.remove('hidden');
                cancelButton.classList.remove('hidden');
                imageUploadSection.classList.remove('hidden');
            } else {
                editButton.classList.remove('hidden');
                saveButton.classList.add('hidden');
                cancelButton.classList.add('hidden');
                imageUploadSection.classList.add('hidden');
                // Reset preview to current server image if editing is cancelled
                imagePreview.src = currentImageUrlHiddenInput.value || 'https://placehold.co/400x400/E2E8F0/AAAAAA?text=รูป';
            }
        }

        function showLoading() {
            document.getElementById('loading-overlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        async function searchDataByUserlineId(userlineId) {
            showLoading();
            try {
                const response = await fetch(`${WEB_APP_URL}?method=getUserData&userlineId=${encodeURIComponent(userlineId)}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    latestData = data[data.length - 1]; // Get the last record
                    setFormInputs(latestData);
                } else {
                    latestData = {}; // Clear if no data
                    setFormInputs({}); // Reset form fields
                    Swal.fire({
                        title: 'ไม่พบข้อมูล',
                        text: 'ดูเหมือนคุณยังไม่ได้ลงทะเบียน หรือไม่มีข้อมูลในระบบ',
                        icon: 'warning',
                        confirmButtonText: 'ตกลง',
                        confirmButtonColor: '#000000',
                    });
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                Swal.fire({
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถดึงข้อมูลได้: ' + error.message,
                    icon: 'error',
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: '#000000',
                });
            } finally {
                hideLoading();
                toggleFormEditing(false); // Ensure form is in view mode initially
            }
        }
        
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return; // Stop further execution until login completes and page reloads
                }
                // If logged in, proceed to get profile and data
                const profile = await liff.getProfile();
                document.getElementById('userId').value = profile.userId || 'N/A';
                document.getElementById('displayName').value = profile.displayName || 'User';
                document.getElementById('profileImage').src = profile.pictureUrl || 'https://placehold.co/100x100/E2E8F0/AAAAAA?text=P';
                
                // Set the user ID for the form (used in submission)
                document.getElementById('edit-userID').value = profile.userId;

                await searchDataByUserlineId(profile.userId);

            } catch (error) {
                console.error('LIFF Initialization or Profile Fetch failed:', error);
                 Swal.fire({
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถเริ่มต้น LIFF หรือดึงข้อมูลโปรไฟล์ได้: ' + error.message,
                    icon: 'error',
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: '#000000',
                });
                hideLoading(); // Ensure loading is hidden on error
                toggleFormEditing(false); // Ensure form is in view mode
            }
        }

        window.onload = () => {
            initializeLiff();
        };

        editButton.addEventListener('click', () => {
            toggleFormEditing(true);
        });

        imageFileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                }
                reader.readAsDataURL(this.files[0]);
            }
        });

        function cancelEdit() {
            setFormInputs(latestData); // Reset form to last fetched data
            toggleFormEditing(false);
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            saveButton.disabled = true;
            saveButton.innerHTML = '<div class="inline-flex items-center"><svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>กำลังบันทึก...</div>';

            const id = document.getElementById('edit-id').value;
            const userID = document.getElementById('edit-userID').value; // This should be the line_user_id
            const name = document.getElementById('edit-name').value;
            const employeeID = document.getElementById('edit-employeeID').value; //เบอร์ติดต่อ
            const department = document.getElementById('edit-department').value; //เพิ่มเติม
            const imageFile = imageFileInput.files[0];

            let base64ImageOrUrl = currentImageUrlHiddenInput.value; // Default to current URL

            if (imageFile) {
                try {
                    base64ImageOrUrl = await getBase64(imageFile);
                } catch (error) {
                    console.error("Error converting image to base64", error);
                    Swal.fire({ title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถแปลงรูปภาพได้', icon: 'error', confirmButtonColor: '#000000'});
                    saveButton.disabled = false;
                    saveButton.innerHTML = 'บันทึกการเปลี่ยนแปลง';
                    return;
                }
            }

            // Construct form data for GAS
            const formData = new URLSearchParams();
            formData.append('method', 'updateData');
            formData.append('id', id); // keyid from spreadsheet
            formData.append('userID', userID); // LINE User ID
            formData.append('name', name);
            formData.append('employeeID', employeeID);
            formData.append('department', department);
            formData.append('imageUrl', base64ImageOrUrl); // This will be base64 string if new image, or existing URL if not changed


            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: formData // No need for JSON.stringify with URLSearchParams, GAS expects x-www-form-urlencoded
                });
                const resultText = await response.text();
                
                if (!response.ok) { // Check if response status is not 2xx
                     throw new Error(resultText || `Server error: ${response.status}`);
                }
                // Assuming GAS returns "Data updated successfully" or similar plain text on success
                if (resultText.toLowerCase().includes('updated') || resultText.toLowerCase().includes('success')) {
                    Swal.fire({
                        title: 'สำเร็จ',
                        text: 'บันทึกข้อมูลเรียบร้อยแล้ว!',
                        icon: 'success',
                        confirmButtonText: 'ตกลง',
                        confirmButtonColor: '#000000'
                    });
                    await searchDataByUserlineId(userID); // Refresh data from server
                    toggleFormEditing(false);
                } else {
                    // If response is OK but text doesn't indicate success as expected
                    throw new Error(resultText || 'การบันทึกอาจไม่สำเร็จ กรุณาตรวจสอบ');
                }

            } catch (error) {
                console.error('Error saving data:', error);
                Swal.fire({
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถบันทึกข้อมูลได้: ' + error.message,
                    icon: 'error',
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: '#000000'
                });
            } finally {
                saveButton.disabled = false;
                saveButton.innerHTML = 'บันทึกการเปลี่ยนแปลง';
            }
        });

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); // Get only base64 part
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
