<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการข้อมูล | Modern White Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Custom styles for focus state to match black theme */
        .input-field:focus {
            outline: none;
            border-color: #000000; /* Black border on focus */
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.2); /* Optional: subtle ring */
        }
        .input-field-disabled {
            background-color: #f3f4f6; /* bg-gray-100 */
            color: #6b7280; /* text-gray-500 */
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: #000000;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1f2937; /* gray-800 */
        }
        .btn-secondary {
            background-color: #4b5563; /* gray-600 */
            color: white;
        }
        .btn-secondary:hover {
            background-color: #374151; /* gray-700 */
        }
        .btn-danger {
            background-color: #dc2626; /* red-600 */
            color: white;
        }
        .btn-danger:hover {
            background-color: #b91c1c; /* red-700 */
        }
    </style>
</head>

<body class="bg-white p-6 min-h-screen">
    <div class="container mx-auto max-w-4xl">
        <h1 class="text-2xl font-semibold text-gray-900 mb-6">จัดการข้อมูลผู้ใช้งาน</h1>
        <!-- ตารางแสดงข้อมูล -->
        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table id="data-table" class="min-w-full text-sm">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="py-3 px-4 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20">รูปภาพ</th>
                        <th class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ชื่อ</th>
                        <th class="py-3 px-4 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-48">คำสั่ง</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200 text-gray-700">
                    <!-- Data rows will be appended here by JavaScript -->
                </tbody>
            </table>
        </div>
        <div id="pagination" class="mt-6 flex justify-center items-center space-x-2">
            <!-- Pagination buttons -->
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-overlay" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="flex flex-col items-center">
            <svg class="animate-spin h-10 w-10 text-white mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-white text-base">กำลังโหลดข้อมูล...</span>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-40 p-4">
        <div class="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-900">แก้ไขข้อมูล</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label for="edit-userID" class="block text-sm font-medium text-gray-700 mb-1">UserID (LINE)</label>
                    <input type="text" id="edit-userID" class="input-field-disabled block w-full border-gray-300 rounded-md shadow-sm p-2.5 text-sm" disabled>
                </div>
                <div>
                    <label for="edit-name" class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-สกุล</label>
                    <input type="text" id="edit-name" class="input-field block w-full border-gray-300 rounded-md shadow-sm p-2.5 text-sm bg-white">
                </div>
                <div>
                    <label for="edit-employeeID" class="block text-sm font-medium text-gray-700 mb-1">เบอร์ติดต่อ</label>
                    <input type="text" id="edit-employeeID" class="input-field block w-full border-gray-300 rounded-md shadow-sm p-2.5 text-sm bg-white">
                </div>
                <div>
                    <label for="edit-department" class="block text-sm font-medium text-gray-700 mb-1">ข้อมูลเพิ่มเติม</label>
                    <input type="text" id="edit-department" class="input-field block w-full border-gray-300 rounded-md shadow-sm p-2.5 text-sm bg-white">
                </div>
                <div>
                    <label for="edit-imageUrl" class="block text-sm font-medium text-gray-700 mb-1">URL รูปภาพ (ถ้ามี)</label>
                    <input type="text" id="edit-imageUrl" class="input-field block w-full border-gray-300 rounded-md shadow-sm p-2.5 text-sm bg-white">
                    <p class="mt-1 text-xs text-gray-500">หากต้องการใช้รูปเดิม ไม่ต้องอัปโหลดใหม่</p>
                </div>
                <div>
                    <label for="edit-image" class="block text-sm font-medium text-gray-700 mb-1">อัปโหลดรูปภาพใหม่</label>
                    <input type="file" id="edit-image" accept="image/*" class="block w-full text-sm text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200">
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" class="btn-secondary py-2 px-4 rounded-lg text-sm font-medium" onclick="closeModal()">ยกเลิก</button>
                    <button type="submit" class="btn-primary py-2 px-4 rounded-lg text-sm font-medium">บันทึกการเปลี่ยนแปลง</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-40 p-4">
        <div class="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto">
             <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-900">รายละเอียดข้อมูล</h2>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="space-y-3 text-sm text-gray-700">
                <div class="flex justify-center mb-4">
                    <img id="detail-image" class="h-24 w-24 object-cover rounded-lg border border-gray-200" src="" alt="รูปภาพ">
                </div>
                <p><strong>UserID (LINE):</strong> <span id="detail-userID" class="text-gray-900"></span></p>
                <p><strong>ชื่อ-สกุล:</strong> <span id="detail-name" class="text-gray-900"></span></p>
                <p><strong>เบอร์ติดต่อ:</strong> <span id="detail-employeeID" class="text-gray-900"></span></p>
                <p><strong>ข้อมูลเพิ่มเติม:</strong> <span id="detail-department" class="text-gray-900"></span></p>
            </div>
            <div class="flex justify-end mt-6">
                <button type="button" class="btn-secondary py-2 px-4 rounded-lg text-sm font-medium" onclick="closeDetailModal()">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxh6MnlWyyyk_zlppsPv8acuyckmCppUaFHuSbEGV2uCU3pHW-dYIpvWVAn12QuyHEW/exec';
        const rowsPerPage = 10;
        let currentPage = 1;
        let tableData = [];

        async function fetchData() {
            showLoading();
            try {
                const response = await fetch(WEB_APP_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                // Assuming first row is header, and we want to skip it if it exists and is empty
                // A better check might be needed depending on your exact data structure
                tableData = data.filter(row => row && row.length > 0 && row.some(cell => cell !== null && cell !== ""));


                // If the first row after filtering looks like a header (e.g., contains "keyid", "userlineId") remove it.
                // This is a heuristic. A more robust solution is for GAS to not send the header.
                if (tableData.length > 0) {
                    const firstRowSample = tableData[0].join('').toLowerCase();
                    if (firstRowSample.includes('keyid') && firstRowSample.includes('userlineid')) {
                        tableData.shift(); // Remove header row if detected
                    }
                }

                displayPage(currentPage);
                setupPagination();
            } catch (error) {
                console.error('Error fetching data:', error);
                Swal.fire({ title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถดึงข้อมูลได้: ' + error.message, icon: 'error', confirmButtonText: 'ตกลง', confirmButtonColor: '#000000' });
            } finally {
                hideLoading();
            }
        }

        function displayPage(page) {
            const startIndex = (page - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const paginatedData = tableData.slice(startIndex, endIndex);
            const tableBody = document.querySelector('#data-table tbody');
            tableBody.innerHTML = '';

            if (paginatedData.length === 0 && tableData.length > 0) { // Data exists but not on this page (e.g. after delete)
                 currentPage = Math.max(1, page -1); // Go to previous page or first page
                 displayPage(currentPage); // Re-display
                 updatePaginationButtons();
                 return;
            }
            if (paginatedData.length === 0) {
                 tableBody.innerHTML = '<tr><td colspan="3" class="py-4 px-4 text-center text-gray-500">ไม่พบข้อมูล</td></tr>';
                 return;
            }

            paginatedData.forEach(row => {
                // Ensure row is an array and has enough elements
                if (!Array.isArray(row) || row.length < 6) {
                    console.warn("Skipping invalid row data:", row);
                    return; // Skip this row if data is malformed
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";

                const imgTd = document.createElement('td');
                imgTd.className = 'py-3 px-4 text-center';
                if (row[5] && typeof row[5] === 'string' && row[5].trim() !== '') {
                    const img = document.createElement('img');
                    img.src = row[5]; // Assuming column F (index 5) is the image URL
                    img.className = 'h-10 w-10 object-cover rounded-md inline-block border border-gray-200';
                    img.alt = 'Profile';
                    img.onerror = function() { this.src = 'https://placehold.co/40x40/E2E8F0/AAAAAA?text=Err'; this.alt = 'Error loading image';}; // Fallback for broken image
                    imgTd.appendChild(img);
                } else {
                    const placeholderImg = document.createElement('img');
                    placeholderImg.src = 'https://placehold.co/40x40/E2E8F0/AAAAAA?text=N/A';
                    placeholderImg.className = 'h-10 w-10 object-cover rounded-md inline-block border border-gray-200';
                    placeholderImg.alt = 'No image';
                    imgTd.appendChild(placeholderImg);
                }
                tr.appendChild(imgTd);

                const nameTd = document.createElement('td');
                nameTd.textContent = row[2] || 'N/A'; // Column C (index 2) for name
                nameTd.className = 'py-3 px-4';
                tr.appendChild(nameTd);

                const actionTd = document.createElement('td');
                actionTd.className = 'py-3 px-4 text-center space-x-2';

                const detailButton = document.createElement('button');
                detailButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline mr-1" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" /></svg>ข้อมูล`;
                detailButton.className = 'btn-secondary text-xs py-1.5 px-3 rounded-md font-medium';
                detailButton.onclick = () => openDetailModal(row);

                const editButton = document.createElement('button');
                editButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>แก้ไข`;
                editButton.className = 'btn-primary text-xs py-1.5 px-3 rounded-md font-medium';
                editButton.onclick = () => openEditModal(row);

                const deleteButton = document.createElement('button');
                deleteButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>ลบ`;
                deleteButton.className = 'btn-danger text-xs py-1.5 px-3 rounded-md font-medium';
                deleteButton.onclick = () => confirmDelete(row[0]); // Column A (index 0) for ID

                actionTd.appendChild(editButton);
                actionTd.appendChild(deleteButton);
                actionTd.appendChild(detailButton);
                tr.appendChild(actionTd);
                tableBody.appendChild(tr);
            });
        }

        function setupPagination() {
            const pageCount = Math.ceil(tableData.length / rowsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (pageCount <= 1) return; // No pagination if only one page or no data

            // Previous Button
            const prevButton = document.createElement('button');
            prevButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>`;
            prevButton.className = `py-2 px-3 rounded-lg text-sm font-medium ${currentPage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-300'}`;
            prevButton.disabled = currentPage === 1;
            prevButton.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    displayPage(currentPage);
                    updatePaginationButtons();
                }
            };
            pagination.appendChild(prevButton);
            
            // Page numbers (simplified for brevity, can be extended for more complex scenarios)
            for (let i = 1; i <= pageCount; i++) {
                 // Logic to show limited page numbers (e.g., first, last, current +/- 2)
                const showPage = (i === 1 || i === pageCount || (i >= currentPage - 1 && i <= currentPage + 1));
                if (pageCount > 5 && !showPage && pagination.lastChild.textContent !== '...') {
                     if ( (i < currentPage -1 && pagination.lastChild.textContent !== '...') || (i > currentPage + 1 &&  !pagination.innerHTML.endsWith('...</span>')) ) {
                        const ellipsis = document.createElement('span');
                        ellipsis.textContent = '...';
                        ellipsis.className = 'py-2 px-3 text-sm text-gray-500';
                        pagination.appendChild(ellipsis);
                        continue;
                     }
                }
                if (!showPage && pageCount > 5) continue;


                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.className = `py-2 px-4 rounded-lg text-sm font-medium ${i === currentPage ? 'bg-black text-white' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-300'}`;
                pageButton.onclick = () => {
                    currentPage = i;
                    displayPage(currentPage);
                    updatePaginationButtons();
                };
                pagination.appendChild(pageButton);
            }

             // Next Button
            const nextButton = document.createElement('button');
            nextButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>`;
            nextButton.className = `py-2 px-3 rounded-lg text-sm font-medium ${currentPage === pageCount ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-300'}`;
            nextButton.disabled = currentPage === pageCount;
            nextButton.onclick = () => {
                if (currentPage < pageCount) {
                    currentPage++;
                    displayPage(currentPage);
                    updatePaginationButtons();
                }
            };
            pagination.appendChild(nextButton);
        }


        function updatePaginationButtons() {
            // This function essentially re-runs setupPagination to reflect current page state
            setupPagination();
        }
        
        async function updateData(id, userID, name, employeeID, department, base64ImageOrUrl) {
            Swal.fire({ title: 'กำลังอัปเดต', text: 'โปรดรอสักครู่...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), confirmButtonColor: '#000000' });
            try {
                const formData = new URLSearchParams();
                formData.append('method', 'updateData');
                formData.append('id', id);
                formData.append('userID', userID);
                formData.append('name', name);
                formData.append('employeeID', employeeID);
                formData.append('department', department);
                formData.append('imageUrl', base64ImageOrUrl); // This can be base64 or existing URL

                const response = await fetch(WEB_APP_URL, { method: 'POST', body: formData });
                const resultText = await response.text();
                if (!response.ok) throw new Error(resultText || `Server error: ${response.status}`);
                
                if (resultText.toLowerCase().includes('updated') || resultText.toLowerCase().includes('success')) {
                    Swal.fire({ title: 'สำเร็จ', text: 'ข้อมูลอัปเดตเรียบร้อยแล้ว', icon: 'success', confirmButtonText: 'ตกลง', confirmButtonColor: '#000000'});
                    fetchData(); // Refresh data
                } else {
                     throw new Error(resultText || 'การอัปเดตอาจไม่สำเร็จ');
                }
            } catch (error) {
                console.error('Error updating data:', error);
                Swal.fire({ title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถอัปเดตข้อมูลได้: ' + error.message, icon: 'error', confirmButtonText: 'ตกลง', confirmButtonColor: '#000000' });
            }
        }

        async function deleteData(id) {
            Swal.fire({ title: 'กำลังลบข้อมูล', text: 'โปรดรอสักครู่...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), confirmButtonColor: '#000000' });
            try {
                const formData = new URLSearchParams();
                formData.append('method', 'deleteData');
                formData.append('id', id);

                const response = await fetch(WEB_APP_URL, { method: 'POST', body: formData });
                const resultText = await response.text();
                if (!response.ok) throw new Error(resultText || `Server error: ${response.status}`);

                if (resultText.toLowerCase().includes('deleted') || resultText.toLowerCase().includes('success')) {
                    Swal.fire({ title: 'ลบเรียบร้อย', text: 'ข้อมูลถูกลบแล้ว', icon: 'success', confirmButtonText: 'ตกลง', confirmButtonColor: '#000000' });
                     // Adjust current page if the last item on the page was deleted
                    const startIndex = (currentPage - 1) * rowsPerPage;
                    if (startIndex >= tableData.length -1 && currentPage > 1) { // -1 because tableData isn't updated yet
                        currentPage--;
                    }
                    fetchData(); // Refresh data
                } else {
                    throw new Error(resultText || 'การลบอาจไม่สำเร็จ');
                }
            } catch (error) {
                console.error('Error deleting data:', error);
                Swal.fire({ title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถลบข้อมูลได้: ' + error.message, icon: 'error', confirmButtonText: 'ตกลง', confirmButtonColor: '#000000' });
            }
        }

        function openEditModal(row) {
            // Assuming row indices: 0:keyid, 1:userlineId, 2:nameId, 3:keynumberId, 4:keynumber2Id, 5:fileLink
            document.getElementById('edit-id').value = row[0] || '';
            document.getElementById('edit-userID').value = row[1] || '';
            document.getElementById('edit-name').value = row[2] || '';
            document.getElementById('edit-employeeID').value = row[3] || ''; // Corresponds to เบอร์ติดต่อ
            document.getElementById('edit-department').value = row[4] || ''; // Corresponds to ข้อมูลเพิ่มเติม
            document.getElementById('edit-imageUrl').value = row[5] || '';
            document.getElementById('edit-image').value = ''; // Clear file input
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function openDetailModal(row) {
            document.getElementById('detail-image').src = (row[5] && typeof row[5] === 'string' && row[5].trim() !== '') ? row[5] : 'https://placehold.co/100x100/E2E8F0/AAAAAA?text=N/A';
            document.getElementById('detail-image').alt = row[2] || 'Profile Image';
            document.getElementById('detail-userID').textContent = row[1] || 'N/A';
            document.getElementById('detail-name').textContent = row[2] || 'N/A';
            document.getElementById('detail-employeeID').textContent = row[3] || 'N/A';
            document.getElementById('detail-department').textContent = row[4] || 'N/A';
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function confirmDelete(id) {
            Swal.fire({
                title: 'ยืนยันการลบ',
                text: "คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลนี้? การกระทำนี้ไม่สามารถย้อนกลับได้",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626', // red-600
                cancelButtonColor: '#6b7280', // gray-500
                confirmButtonText: 'ใช่, ลบเลย!',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    deleteData(id);
                }
            });
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result); // Send full data URI or just base64 part
                // If GAS expects only base64: reader.result.split(',')[1]
                reader.onerror = error => reject(error);
            });
        }
        
        document.getElementById('edit-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const saveButton = this.querySelector('button[type="submit"]');
            const originalButtonText = saveButton.innerHTML;
            saveButton.disabled = true;
            saveButton.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 inline text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>กำลังบันทึก...`;

            const id = document.getElementById('edit-id').value;
            const userID = document.getElementById('edit-userID').value;
            const name = document.getElementById('edit-name').value;
            const employeeID = document.getElementById('edit-employeeID').value;
            const department = document.getElementById('edit-department').value;
            const imageFile = document.getElementById('edit-image').files[0];
            let imageUrlToSave = document.getElementById('edit-imageUrl').value; // Existing URL or manually entered one

            try {
                if (imageFile) {
                    imageUrlToSave = await getBase64(imageFile); // This will be a data URI
                }
                await updateData(id, userID, name, employeeID, department, imageUrlToSave);
            } catch (error) {
                console.error('Error during form submission:', error);
                // Swal for error is handled within updateData
            } finally {
                saveButton.disabled = false;
                saveButton.innerHTML = originalButtonText; // Restore original button text
                closeModal(); // Close modal regardless of success/failure (or only on success)
            }
        });

        function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

        window.onload = fetchData;
    </script>
</body>
</html>
