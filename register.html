<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <style>
        /* เพิ่มการเปลี่ยนแปลงสำหรับ Transition เมื่อสลับธีม */
        .transition-colors {
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>

<body class="transition-colors bg-gradient-to-r from-gray-100 to-gray-200 dark:from-slate-900 dark:to-slate-800 flex justify-center items-center max-w-sm mx-auto min-h-screen">
    <div class="w-full p-6 bg-white dark:bg-gray-800 rounded-lg shadow-lg">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-gray-900 dark:text-gray-100 text-xs">Welcome back</p>
                <input type="text" class="input-field bg-gray-100 dark:bg-slate-900 text-gray-900 dark:text-white text-xl font-bold bg-opacity-0"
                    id="displayName" name="displayName" readonly>
            </div>
            <div class="flex items-center space-x-4">
                <button id="themeToggle" class="focus:outline-none">
                    <!-- ไอคอนสำหรับ Light Mode -->
                    <svg id="themeLightIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m8.66-11h-1M4.34 12h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 000 14 7 7 0 000-14z" />
                    </svg>
                    <!-- ไอคอนสำหรับ Dark Mode -->
                    <svg id="themeDarkIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                    </svg>
                </button>
                <div class="w-12 h-12 rounded-lg flex justify-center items-center shadow-inner">
                    <img src="" alt="Profile Image" id="profileImage"
                        class="w-10 h-10 bg-white rounded-lg shadow-lg">
                </div>
            </div>
        </div>

        <form>
            <div class="flex items-center space-x-2 mb-4">
                <input type="text"
                    class="input-field w-full bg-gray-100 dark:bg-gray-700 p-2 text-center text-xs text-teal-400 rounded-md"
                    id="userlineId" placeholder="lineId" name="userlineId">
            </div>
            <div class="flex justify-center">
                <div class="mb-5 text-center">
                    <div class="mx-auto w-16 h-16 rounded-lg bg-gray-100 dark:bg-gray-700 shadow-inset">
                        <img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png"
                            alt="Default Image" id="preview" class="h-16 w-16 object-cover rounded-md">
                    </div>
                </div>
                <div class="mb-5 text-center">
                    <label for="file"
                        class="cursor-pointer inline-flex justify-between items-center py-2 px-4 rounded-lg shadow-sm text-left text-gray-500 dark:text-gray-300 bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 hover:text-gray-600">
                        <img src="https://img.icons8.com/?size=100&id=748&format=png&color=000000" class="w-6 h-6 mx-1">
                        อัพโหลดรูป
                        <input type="file" id="file" name="file" accept="image/*" class="hidden">
                    </label>
                    <div class="mx-auto w-48 text-gray-500 dark:text-gray-300 text-xs text-center mt-1">คลิกเพื่ออัพโหลดรูปของคุณ</div>
                </div>
            </div>
            <div class="flex items-center space-x-2 mb-4">
                <input type="text" class="input-field w-full bg-gray-100 dark:bg-gray-700 p-2 text-md text-gray-900 dark:text-gray-100 rounded-md" id="nameId"
                    placeholder="ชื่อ-สกุล" name="nameId" required>
            </div>
            <div class="flex items-center space-x-2 mb-4">
                <input type="text" class="input-field w-full bg-gray-100 dark:bg-gray-700 p-2 text-md text-gray-900 dark:text-gray-100 rounded-md"
                    id="keynumberId" placeholder="เบอร์ติดต่อ" name="keynumberId" required>
            </div>
            <div class="flex items-center space-x-2 mb-6">
                <input type="text" class="input-field w-full bg-gray-100 dark:bg-gray-700 p-2 text-md text-gray-900 dark:text-gray-100 rounded-md"
                    id="keynumber2Id" placeholder="เพิ่มเติม" name="keynumber2Id" required>
            </div>
            <button type="button" id="submitBtn" class="bg-teal-400 text-center w-full text-teal-900 p-4 rounded-md shadow-md hover:bg-teal-600 dark:bg-teal-600 dark:text-teal-100 dark:hover:bg-teal-700">บันทึกข้อมูล</button>
        </form>
    </div>
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script>
        // ลิ้งจาก ระบบสมาชิก
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxh6MnlWyyyk_zlppsPv8acuyckmCppUaFHuSbEGV2uCU3pHW-dYIpvWVAn12QuyHEW/exec';
        // Liff ไอดีไล์เรียกใช้หน้าข้อมูลส่วนตัว
        const LIFF_ID = '2006806033-yY52Xb0x'; // LIFF ID
        const DEFAULT_IMAGE_URL = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png';

        // ฟังก์ชันเริ่มต้น LIFF SDK
        window.onload = function () {
            initializeLiff();
            initializeTheme();
        };

        // ฟังก์ชันสำหรับเริ่มต้น LIFF SDK
        async function initializeLiff() {
            await liff.init({ liffId: `${LIFF_ID}` });

            if (liff.isLoggedIn()) {
                getUserProfile();
            } else {
                liff.login();
            }
        }

        // ฟังก์ชันสำหรับดึงข้อมูลโปรไฟล์ของผู้ใช้
        async function getUserProfile() {
            try {
                const profile = await liff.getProfile();
                document.getElementById('userlineId').value = profile.userId;
                document.getElementById('displayName').value = profile.displayName;
                document.getElementById('profileImage').src = profile.pictureUrl || DEFAULT_IMAGE_URL;
            } catch (error) {
                console.error('เกิดข้อผิดพลาดในการดึงข้อมูลโปรไฟล์:', error);
            }
        }

        // ฟังก์ชันสำหรับส่งข้อความ Flex
        async function sendFlexMessage() {
            const flexMessage = {
                type: 'flex',
                altText: 'ลงทะเบียนเรียบร้อย',
                contents: {
                    type: 'bubble',
                    styles: {
                        header: {
                            backgroundColor: '#262A35'
                        },
                        footer: {
                            backgroundColor: '#194E44'
                        },
                        body: {
                            backgroundColor: '#ffffff'
                        }
                    },
                    header: {
                        type: 'box',
                        layout: 'vertical',
                        contents: [
                            {
                                type: 'text',
                                text: 'ข้อมูลลงทะเบียนสำเร็จ',
                                weight: 'bold',
                                size: 'lg',
                                color: '#FFFFFF',
                                align: 'center'
                            }
                        ]
                    },
                    body: {
                        type: 'box',
                        layout: 'vertical',
                        contents: [
                            {
                                type: 'box',
                                layout: 'vertical',
                                margin: 'lg',
                                spacing: 'sm',
                                contents: [
                                    {
                                        type: 'box',
                                        layout: 'horizontal',
                                        contents: [
                                            {
                                                type: 'text',
                                                text: 'ชื่อ-สกุล',
                                                size: 'sm',
                                                color: '#555555',
                                                flex: 1
                                            },
                                            {
                                                type: 'text',
                                                text: document.getElementById('nameId').value,
                                                size: 'sm',
                                                color: '#111111',
                                                align: 'end',
                                                flex: 2
                                            }
                                        ]
                                    },
                                    {
                                        type: 'box',
                                        layout: 'horizontal',
                                        contents: [
                                            {
                                                type: 'text',
                                                text: 'เบอร์ติดต่อ',
                                                size: 'sm',
                                                color: '#555555',
                                                flex: 1
                                            },
                                            {
                                                type: 'text',
                                                text: document.getElementById('keynumberId').value,
                                                size: 'sm',
                                                color: '#111111',
                                                align: 'end',
                                                flex: 2
                                            }
                                        ]
                                    },
                                    {
                                        type: 'box',
                                        layout: 'horizontal',
                                        contents: [
                                            {
                                                type: 'text',
                                                text: 'อีเมล',
                                                size: 'sm',
                                                color: '#555555',
                                                flex: 1
                                            },
                                            {
                                                type: 'text',
                                                text: document.getElementById('keynumber2Id').value,
                                                size: 'sm',
                                                color: '#111111',
                                                align: 'end',
                                                flex: 2
                                            }
                                        ]
                                    }
                                ]
                            }
                        ]
                    },
                    footer: {
                        type: 'box',
                        layout: 'vertical',
                        contents: [
                            {
                                type: 'text',
                                text: 'รับพ้อย 10 ทันที!',
                                size: 'sm',
                                color: '#FFD454',
                                align: 'center'
                            }
                        ]
                    }
                }
            };

            await liff.sendMessages([flexMessage]);
        }

        let url = `${WEB_APP_URL}`;
        let fileInput = document.getElementById("file");
        let imgPreview = document.getElementById("preview");
        let userlineIdInput = document.getElementById("userlineId");
        let nameIdInput = document.getElementById("nameId");
        let keynumberIdInput = document.getElementById("keynumberId");
        let keynumber2IdInput = document.getElementById("keynumber2Id");
        let submitBtn = document.getElementById("submitBtn");

        // ฟังก์ชันสำหรับแปลงไฟล์เป็น Base64
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                let reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // ฟังก์ชันสำหรับแสดงภาพตัวอย่าง
        function previewImage() {
            if (fileInput.files.length > 0) {
                let file = fileInput.files[0];
                let reader = new FileReader();

                reader.onload = function (e) {
                    imgPreview.src = e.target.result;
                };

                reader.readAsDataURL(file);
            } else {
                imgPreview.src = "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png";
            }
        }

        // เพิ่ม event listener สำหรับการเปลี่ยนแปลงใน input file
        fileInput.addEventListener('change', () => {
            previewImage();
        });

        // ฟังก์ชันสำหรับตรวจสอบการกรอกข้อมูลในฟิลด์ที่จำเป็น
        function validateForm() {
            const userlineId = userlineIdInput.value.trim();
            const nameId = nameIdInput.value.trim();
            const keynumberId = keynumberIdInput.value.trim();
            const keynumber2Id = keynumber2IdInput.value.trim();

            if (userlineId === '' || nameId === '' || keynumberId === '' || keynumber2Id === '') {
                return false;
            }

            return true;
        }

        // เพิ่ม event listener สำหรับปุ่มบันทึกข้อมูล
        submitBtn.addEventListener('click', async (event) => {
            event.preventDefault();

            if (!validateForm()) {
                Swal.fire({
                    icon: 'error',
                    title: 'Validation Error',
                    text: 'กรุณากรอกข้อมูลในช่องที่จำเป็น.',
                });
                return;
            }

            const isConfirmed = await showConfirmationDialog();

            if (isConfirmed) {
                submitBtn.disabled = true;

                try {
                    let obj;

                    if (fileInput.files.length > 0) {
                        let file = fileInput.files[0];
                        let base64 = await getBase64(file);
                        imgPreview.src = `data:${file.type};base64,${base64}`;

                        obj = {
                            base64: base64,
                            type: file.type,
                            name: file.name,
                            userlineId: userlineIdInput.value,
                            nameId: nameIdInput.value,
                            keynumberId: keynumberIdInput.value,
                            keynumber2Id: keynumber2IdInput.value
                        };
                    } else {
                        let response = await fetch("https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png");
                        let blob = await response.blob();
                        let base64 = await getBase64(blob);

                        obj = {
                            base64: base64,
                            type: "image/png",
                            name: "Avatar.png",
                            userlineId: userlineIdInput.value,
                            nameId: nameIdInput.value,
                            keynumberId: keynumberIdInput.value,
                            keynumber2Id: keynumber2IdInput.value
                        };
                    }

                    Swal.fire({
                        title: '<div class="text-md">กำลังบันทึก, รอสักครู่...</div>',
                        allowOutsideClick: false,
                        showConfirmButton: false,
                        html: '<div class="swal2-loading"></div>',
                        onBeforeOpen: () => {
                            Swal.showLoading();
                        }
                    });

                    let response = await fetch(url, {
                        method: "POST",
                        body: JSON.stringify(obj)
                    });

                    let data = await response.text();

                    Swal.fire({
                        title: 'สำเร็จ!',
                        text: 'บันทึกข้อมูลของคุณเรียบร้อย!',
                        icon: 'success',
                        confirmButtonText: 'ปิด',
                    }).then((result) => {
                        if (result.isConfirmed) {
                            liff.closeWindow();
                        }
                    });
                    sendFlexMessage();
                    console.log(data);
                } catch (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'เกิดข้อผิดพลาดขณะส่งข้อมูล.',
                    });

                    console.error(error);
                } finally {
                    submitBtn.disabled = false;
                }
            } else {
                Swal.fire('Submission Canceled', 'ข้อมูลของคุณไม่ได้ถูกส่ง.', 'info');
            }
        });

        // ฟังก์ชันสำหรับแสดงกล่องยืนยัน
        async function showConfirmationDialog() {
            const confirmation = await Swal.fire({
                title: 'ยืนยันการส่งข้อมูล',
                text: 'แน่ใจ ว่าคุณกำลังส่งข้อมูล?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ใช่, ส่งข้อมูล!',
                cancelButtonText: 'ไม่, ยกเลิก'
            });

            return confirmation.isConfirmed;
        }

        // ฟังก์ชันสำหรับสลับธีม
        function initializeTheme() {
            const themeToggle = document.getElementById('themeToggle');
            const lightIcon = document.getElementById('themeLightIcon');
            const darkIcon = document.getElementById('themeDarkIcon');

            // โหลดธีมที่เก็บไว้ใน localStorage
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                lightIcon.classList.add('hidden');
                darkIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            }

            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                if (document.documentElement.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                    lightIcon.classList.add('hidden');
                    darkIcon.classList.remove('hidden');
                } else {
                    localStorage.setItem('theme', 'light');
                    lightIcon.classList.remove('hidden');
                    darkIcon.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
